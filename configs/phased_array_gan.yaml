# 独立 GaN RFALT 源域与 LEO 相控阵目标域配置；二者不共享状态积分器。
seed: 42

source:
  name: synthetic-GaN-RFALT
  schema_version: gan_rfalt_v1
  dynamics_id: rfalt_lumped_v1
  raw_path: data/simulated/phased_array_gan/rfalt_smoke.h5
  feature_path: data/features/phased_array_gan/source/rfalt_source.h5
  n_devices: 48
  duration_s: 864000
  sample_period_s: 600
  stress_modes: [rfalt_cw, rfalt_modulated, recovery]
  rul_cap_ratio: 0.35

target:
  dynamics_id: leo_coupled_v1
  raw_path: data/simulated/phased_array_gan/target_raw.h5
  feature_path: data/features/phased_array_gan/target/target_features.h5
  # 预注册组合 OOD：三项同时达到角点的轨迹仅可作为 ood_test，禁止进入 train/val/IID test。
  ood_holdout:
    schema_version: target_ood_conditions_v1
    abs_scan_az_deg_min: 30.0
    duty_cycle_min: 0.70
    Tj_base_C_min: 125.0

sim:
  n_traj: 50
  duration_years: 8.0
  sample_period_s: 21600
  physics_dt_s: 300
  array:
    n_elements: 256
    grid: [16, 16]
    element_spacing_lambda: 0.5
    scan_az_deg_range: [-45.0, 45.0]
    scan_el_deg: 0.0
    subarray_block: 4
  physics:
    damage_path: gan_state
    Ea_eV_range: [0.7, 1.1]
    Tj_range_C: [90.0, 140.0]
    duty_cycle_range: [0.3, 0.8]
    R_DS_drift_Delta_range: [1.2, 1.5]
    IDSS_decay_range: [0.08, 0.12]
    gm_decay_range: [0.04, 0.08]
    phase_drift_deg_range: [0.0, 5.0]
    device_spread_sigma: 0.3
    life_scale_sigma: 0.30
    D_EOL_fixed: 0.006
    damage_model:
      thermal_cycle_gain: 1.2
      duty_scan_gain: 0.8
      rth_feedback_gain: 4.0
    hotspot_field:
      enabled: true
      n_hotspots_range: [1, 3]
      radius_lambda_range: [1.0, 3.0]
      Tj_boost_C_range: [5.0, 15.0]
    channel_dropout_weibull:
      enabled: true
      beta: 2.5
  link_budget:
    initial_margin_dB_range: [1.5, 2.0]
  service_limits:
    SLL_max_dB: -8.0
    theta_err_max_deg: 0.5
    consecutive_windows: 4
  disturbance:
    noise_ratio: 0.01
    spatial_cluster_prob: 0.2
    telemetry_missing_prob: 0.0

damage_state:
  names: [d_perm, q_trap, r_th]
  source_observation_head: [gain_dB, Pout_dBm, PAE, RDS_dynamic_ohm]
  target_observation_head: [gain_dB, phase_deg, Pout_dBm, PAE]
  source_state_init: [0.0, 0.0, 0.0]
  target_state_init: [0.0, 0.0, 0.0]

transfer:
  mode: damage_state
  # 源/目标共用的物理秒归一尺度；不得按各域样本中位 dt 单独估计。
  transition_time_scale_s: 21600.0
  target_train_counts: [1, 3, 5, 10]
  n_seeds: 10
  primary_counts: [3, 5]
  primary_min_delta_nrmse: 0.02
  # 空间正式矩阵预注册：M_link 主效应量与 EIRP/SLL/指向不恶化方向门槛。
  spatial_primary_min_delta_nrmse: 0.02
  spatial_non_degradation_min_delta_nrmse: 0.0
  full_data_noninferiority_nrmse: 0.01
  groups: [target_only, gan_transition_init, gan_joint_no_align, random_source_control]
  historical_negative_control:
    config: configs/phased_array.yaml
    mode: latent_legacy
    result: docs/results_phased_array.md

reproducibility:
  deterministic: true
  cudnn_benchmark: false
